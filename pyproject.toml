[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-device-report"
version = "1.0.0"
description = "Privacy-safe bilingual Windows device inventory report generator"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "dsa_cat" }]
dependencies = ["python-docx>=1.1,<2"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pyinstaller>=6.10",
    "pytest>=8",
]

[project.scripts]
device-report = "device_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

