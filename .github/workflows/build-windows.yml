name: Build Windows EXE

on:
  push:
    branches:
      - 1.0.0-dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Build one-file executable
        run: python -m PyInstaller DeviceReport.spec --clean --noconfirm

      - name: Verify executable and help
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path dist -File)
          if ($files.Count -ne 1) { throw "dist must contain exactly one file" }
          if ($files[0].Name -ne "DeviceReport.exe") { throw "unexpected artifact name" }
          & .\dist\DeviceReport.exe --help
          if ($LASTEXITCODE -ne 0) { throw "EXE help smoke test failed" }

      - name: Upload DeviceReport.exe
        uses: actions/upload-artifact@v4
        with:
          name: DeviceReport-windows-x64
          path: dist/DeviceReport.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publish clean 1.0.0 branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/1.0.0-dev'
        shell: pwsh
        run: |
          Copy-Item README.md "$env:RUNNER_TEMP\README.md"
          Copy-Item LICENSE "$env:RUNNER_TEMP\LICENSE"
          Copy-Item dist\DeviceReport.exe "$env:RUNNER_TEMP\DeviceReport.exe"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin 1.0.0:refs/remotes/origin/1.0.0
          git checkout -B release-output origin/1.0.0
          git rm -rf .
          Copy-Item "$env:RUNNER_TEMP\README.md" README.md
          Copy-Item "$env:RUNNER_TEMP\LICENSE" LICENSE
          Copy-Item "$env:RUNNER_TEMP\DeviceReport.exe" DeviceReport.exe
          git add README.md LICENSE DeviceReport.exe
          git commit -m "release: DeviceReport 1.0.0"
          git push origin HEAD:refs/heads/1.0.0
          $legacy = git ls-remote --heads origin refs/heads/v1.0.0
          if ($legacy) { git push origin --delete v1.0.0 }
          $customization = git ls-remote --heads origin refs/heads/feature/report-customization
          if ($customization) { git push origin --delete feature/report-customization }
